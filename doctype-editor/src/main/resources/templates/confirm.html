<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Änderungen bestätigen</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <h1>Änderungen bestätigen</h1>

        <div class="confirmation-info">
            <p>Bitte überprüfen Sie die folgenden Änderungen:</p>
        </div>

        <div class="changes-summary" id="changesSummary">
            <!-- Änderungen werden per JavaScript geladen -->
        </div>

        <div class="confirmation-controls">
            <label class="checkbox-container">
                <input type="checkbox" id="confirmCheckbox">
                <span>Ich bestätige, dass alle Änderungen korrekt sind und übernommen werden sollen.</span>
            </label>

            <div class="button-group">
                <button id="backBtn" class="btn btn-secondary">Zurück zur Tabelle</button>
                <button id="applyBtn" class="btn btn-primary" disabled>Änderungen übernehmen</button>
            </div>
        </div>

        <div id="resultMessage" class="message" style="display: none;"></div>
    </div>

    <script th:src="@{/js/confirm.js}"></script>
</body>
</html>
